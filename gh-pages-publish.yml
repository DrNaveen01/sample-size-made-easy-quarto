name: Publish Quarto Book to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render HTML book
        run: quarto render --to html
      - name: Verify output
        run: test -f _book/index.html
      - name: Publish HTML to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
